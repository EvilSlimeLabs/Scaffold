<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="640" height="440" rx="10" fill="#f7f7f4"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#222">Top view: two pieces, seen from above</text>

  <!-- grid, one line every four blocks -->
  <g stroke="#e2e2dc" stroke-width="1">
    <line x1="40" y1="40" x2="40" y2="360"/><line x1="72" y1="40" x2="72" y2="360"/>
    <line x1="104" y1="40" x2="104" y2="360"/><line x1="136" y1="40" x2="136" y2="360"/>
    <line x1="168" y1="40" x2="168" y2="360"/><line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="232" y1="40" x2="232" y2="360"/><line x1="264" y1="40" x2="264" y2="360"/>
    <line x1="296" y1="40" x2="296" y2="360"/><line x1="328" y1="40" x2="328" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/><line x1="392" y1="40" x2="392" y2="360"/>
    <line x1="424" y1="40" x2="424" y2="360"/><line x1="456" y1="40" x2="456" y2="360"/>
    <line x1="40" y1="40" x2="472" y2="40"/><line x1="40" y1="72" x2="472" y2="72"/>
    <line x1="40" y1="104" x2="472" y2="104"/><line x1="40" y1="136" x2="472" y2="136"/>
    <line x1="40" y1="168" x2="472" y2="168"/><line x1="40" y1="200" x2="472" y2="200"/>
    <line x1="40" y1="232" x2="472" y2="232"/><line x1="40" y1="264" x2="472" y2="264"/>
    <line x1="40" y1="296" x2="472" y2="296"/><line x1="40" y1="328" x2="472" y2="328"/>
    <line x1="40" y1="360" x2="472" y2="360"/>
  </g>

  <!-- the whole build, as big build mode lays it out -->
  <rect x="72" y="72" width="368" height="256" fill="none" stroke="#7a7a72" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="350" fill="#5a5a52" text-anchor="middle">the whole build: X −40 to 6, Z −24 to 8</text>

  <!-- piece A -->
  <rect x="72" y="200" width="192" height="128" fill="#9cc3e6" fill-opacity="0.75" stroke="#2f6fa8" stroke-width="2"/>
  <text x="168" y="256" text-anchor="middle" font-weight="600" fill="#17426b">Piece A</text>
  <text x="168" y="274" text-anchor="middle" fill="#17426b">saved at X −40, Z −8</text>

  <!-- piece B -->
  <rect x="280" y="72" width="160" height="112" fill="#f2c48d" fill-opacity="0.8" stroke="#b06b1c" stroke-width="2"/>
  <text x="360" y="124" text-anchor="middle" font-weight="600" fill="#6b3d07">Piece B</text>
  <text x="360" y="142" text-anchor="middle" fill="#6b3d07">saved at X −14, Z −24</text>

  <!-- the corner -->
  <circle cx="72" cy="72" r="7" fill="#c0392b"/>
  <text x="86" y="62" font-weight="600" fill="#a02d22">Corner: X −40, Z −24</text>
  <text x="86" y="92" fill="#a02d22" font-size="12">smallest X and smallest Z</text>

  <!-- compass -->
  <g transform="translate(560,170)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#c9c9c0"/>
    <line x1="0" y1="0" x2="0" y2="-34" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-42 -6,-30 6,-30" fill="#333"/>
    <line x1="0" y1="0" x2="34" y2="0" stroke="#333" stroke-width="2.5"/>
    <polygon points="42,0 30,-6 30,6" fill="#333"/>
    <text x="0" y="-52" text-anchor="middle" font-weight="600" fill="#222">North</text>
    <text x="0" y="68" text-anchor="middle" fill="#555" font-size="12">North is −Z</text>
    <text x="0" y="84" text-anchor="middle" fill="#555" font-size="12">East is +X</text>
    <text x="50" y="-8" fill="#222" font-weight="600">East</text>
  </g>
  <text x="560" y="300" text-anchor="middle" fill="#555" font-size="12">So the north west</text>
  <text x="560" y="316" text-anchor="middle" fill="#555" font-size="12">corner has the</text>
  <text x="560" y="332" text-anchor="middle" fill="#555" font-size="12">smallest X and Z.</text>

  <text x="20" y="410" fill="#444">Each piece keeps the place it was saved from. Big build mode puts every piece back at that place,</text>
  <text x="20" y="428" fill="#444">and the corner is where the whole build starts.</text>
</svg>
