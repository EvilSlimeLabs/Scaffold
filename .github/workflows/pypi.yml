# Puts the Python package on PyPI when a GitHub release is published.
#
# The release itself is made on the machine that built and signed it, by
# `python build.py --publish`; this is the one step that runs here, because PyPI
# trusts uploads from this workflow without any token (trusted publishing). The
# project's pending publisher on PyPI names this file and the `pypi` environment.
# See "Release and distribution" in CLAUDE.md.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      ## `pyproject-build`, not `python -m build`: run from the checkout,
      ## the second imports the project's own build.py
      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade build
          pyproject-build --outdir dist-pypi
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist-pypi/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
